app = "rfi-irfos-web-2"
primary_region = "fra"

[build]

[env]
  PORT = "3000"
  STATIC_DIR = "/app/dist"
  DB_PATH = "/data/visits.db"
  # Added 2026-10-25: contacts.jsonl was defaulting onto the app's own image
  # filesystem (not this mount), so it got silently wiped on every `fly
  # deploy` despite being documented as "durable". See backend/src/contact.rs.
  CONTACTS_PATH = "/data/contacts.jsonl"

[[mounts]]
  source = "rfi_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Lighthouse R82 (2026-10-31, Simeon ok): keep one machine warm. With 0 the single machine
  # auto-stopped between visits, so the first visitor (and Googlebot, DLT clicks) waited ~1 s for a
  # cold start and the bot trap lost its in-memory scores on every stop.
  min_machines_running = 1
  processes = ["app"]

  # Lighthouse round 54 (2026-10-31): no check existed, so a machine that booted but
  # stopped answering kept receiving traffic. /security.txt is static and cheap.
  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/.well-known/security.txt"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
