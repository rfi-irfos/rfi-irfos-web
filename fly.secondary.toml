# ACHTUNG (22.10.2026): NICHT zum Deployen benutzen. Diese Datei hat kein [[mounts]] fuer das Volume rfi_data,
# Fly stoppt den Rollout und --yes wuerde das Volume mit der SQLite-DB abhaengen. Deploy: flyctl deploy --remote-only
# (nutzt fly.toml).
app = "rfi-irfos-web-2"
primary_region = "fra"

[build]

[env]
  PORT = "3000"
  STATIC_DIR = "/app/dist"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
