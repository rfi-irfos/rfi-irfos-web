# rfi-irfos.com on the Colony in Graz. Copy to ~/services/rfi-web/ and start with
#   RFI_WEB_TAG=<sha> sudo -n docker compose -p rfi-web up -d
# Secrets live in /srv/data/rfi-web/secrets.env (0600, never in git); names are listed in secrets.env.example.
name: rfi-web
services:
  web:
    image: rfi-web-img:${RFI_WEB_TAG:?set RFI_WEB_TAG to the image tag, e.g. 42b2fb4}
    restart: always
    mem_limit: 512m
    ports: ["127.0.0.1:3108:3000"]
    env_file: /srv/data/rfi-web/secrets.env
    environment:
      PORT: "3000"
      STATIC_DIR: /app/dist
      DB_PATH: /data/visits.db
      CONTACTS_PATH: /data/contacts.jsonl
      LIGHTHOUSE_BASE_URL: https://lighthouse.rfi-irfos.com
      # Caddy overwrites this header from Cf-Connecting-IP; the backend trusts nothing else.
      CLIENT_IP_HEADER: x-rfi-client-ip
      NTFY_BASE_URL: http://ntfy:80
      GEOIP_CITY_DB: /geo/dbip-city-lite.mmdb
      GEOIP_ASN_DB: /geo/dbip-asn-lite.mmdb
    volumes:
      - /srv/data/rfi-web/data:/data
      - /srv/data/rfi-web/geo:/geo:ro
    depends_on: [ntfy]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3000 && printf 'GET /.well-known/security.txt HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ntfy:
    image: binwiederhier/ntfy:latest
    command: serve
    restart: always
    mem_limit: 128m
    ports: ["127.0.0.1:3109:80"]
    environment:
      NTFY_BASE_URL: https://ntfy.rfi-irfos.com
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: write-only
      NTFY_BEHIND_PROXY: "true"
      NTFY_UPSTREAM_BASE_URL: ""
    volumes:
      - /srv/data/rfi-web/ntfy:/var/lib/ntfy
